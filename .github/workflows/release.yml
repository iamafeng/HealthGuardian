name: 🚀 Release Desktop App

# 推送 v* 格式 tag 时自动触发（如 git tag v1.0.0 && git push origin v1.0.0）
on:
  push:
    tags:
      - 'v*'

# 必须显式授权才能创建 Release 并上传附件
permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: 安装 Electron 依赖
        working-directory: electron
        run: npm ci

      - name: 构建 Windows NSIS 安装包
        working-directory: electron
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出构建产物（调试）
        run: Get-ChildItem electron/dist/ -Recurse -Filter "*.exe" | Select-Object FullName, Length
        shell: pwsh

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.exe
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

