<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthGuardian</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00f2fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 254, 0.2);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            width: 80%;
            max-width: 500px;
        }
        h1 {
            color: #ff4757;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        h1::before {
            content: "⚠️ ";
        }
        p {
            font-size: 1.1rem;
            color: #a4b0be;
            line-height: 1.6;
        }
        .status-msg {
            margin-top: 20px;
            color: #00f2fe;
            font-size: 0.9rem;
        }
        .loader {
            display: inline-block;
            margin-top: 15px;
            border: 4px solid rgba(0, 242, 254, 0.2);
            border-left-color: #00f2fe;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .backend-url {
            color: #ff4757;
            font-size: 1.2rem;
            display: block;
            margin: 10px 0;
            word-break: break-all;
        }
        .form-group {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #00f2fe;
        }
        button {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s, transform 0.1s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>连接失败</h1>
        <p>无法连接到后端控制中枢：<br/><b id="backend-display" class="backend-url">http://localhost:8080</b></p>
        
        <div class="form-group">
            <input type="text" id="url-input" list="default-urls" placeholder="选择或输入服务端地址 (包含 http/https)">
            <datalist id="default-urls">
                <option value="http://localhost:8080">
                <option value="https://health.afenghu.com/">
            </datalist>
            <button onclick="saveUrl()">重新连接</button>
        </div>

        <div class="loader"></div>
        <p class="status-msg">正在后台持续嗅探目标地址，连接成功将自动唤醒...</p>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        const params = new URLSearchParams(window.location.search);
        const urlParam = params.get('url');
        if (urlParam) {
            document.getElementById('backend-display').innerText = urlParam;
            document.getElementById('url-input').value = urlParam;
        }

        function saveUrl() {
            let newUrl = document.getElementById('url-input').value.trim();
            if(!newUrl.startsWith('http')) {
                newUrl = 'http://' + newUrl;
                document.getElementById('url-input').value = newUrl;
            }
            document.getElementById('backend-display').innerText = '正在重连...';
            // 发送消息到主进程保存配置
            ipcRenderer.send('update-backend-url', newUrl);
        }
    </script>
</body>
</html>
