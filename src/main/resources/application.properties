# 服务器运行的端口，默认 8080
server.port=8080

# 数据库连接设置
# health_guardian 是我们在 MySQL 中创建的数据库名字
# useSSL=false 意思是暂时不使用加密连接，方便我们在本地快速测试
spring.datasource.url=jdbc:mysql://localhost:3306/health_guardian?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# 你的 MySQL 用户名
spring.datasource.username=health_guardian
# 你的 MySQL 密码，记得修改成你自己的！
spring.datasource.password=health_guardian
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 开启 SQL 打印日志，这样你在控制台就能看到程序到底对数据库做了什么
logging.level.org.springframework.jdbc.core.JdbcTemplate=info
