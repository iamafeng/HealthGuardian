<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
html, body { width:140px; background:transparent; overflow:hidden; }

.pet-wrap {
  position: relative;
  width: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 8px;
  -webkit-app-region: drag;
}

.sprite {
  width: 96px; height: 96px;
  background-image: url('/pet/img/cat_OrangeTabby.png');
  background-size: 400% 400%;
  background-position: 0 0;
  image-rendering: pixelated;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
  -webkit-app-region: no-drag;
  cursor: pointer;
  transition: filter 0.3s;
}
.sprite.bad { filter: drop-shadow(0 6px 12px rgba(244,63,94,0.6)) hue-rotate(300deg); }

.hp-bar {
  width: 72px; height: 5px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px; overflow: hidden;
  margin-top: 6px;
}
.hp-fill {
  height: 100%; width: 20%;
  background: linear-gradient(to right,#f43f5e,#10b981);
  border-radius: 3px; transition: width 0.8s;
}

.bubble {
  position: absolute;
  bottom: 115%;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: rgba(10,18,35,0.92);
  border: 1px solid rgba(0,242,254,0.5);
  color: #f8fafc;
  padding: 6px 10px;
  border-radius: 10px 10px 10px 2px;
  font-size: 0.65rem;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  font-family: 'Segoe UI','Microsoft YaHei',sans-serif;
  z-index: 10;
}
.bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.data-panel {
  width: 200px;
  background: rgba(10,18,35,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(0,242,254,0.2);
  border-radius: 14px;
  padding: 10px 12px 8px;
  font-family: 'Segoe UI','Microsoft YaHei',sans-serif;
  color: #f8fafc;
  margin-top: 6px;
  display: none;
  -webkit-app-region: no-drag;
}
.data-panel.bad-posture { border-color: rgba(244,63,94,0.5); }

.stats { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-bottom:6px; }
.stat { background:rgba(255,255,255,0.04); border-radius:8px; padding:5px 7px; text-align:center; }
.stat-val { font-size:0.95rem; font-weight:800; font-family:'Courier New',monospace; color:#00f2fe; line-height:1; }
.stat.pomo .stat-val { color:#fbbf24; }
.stat.pomo.idle .stat-val { color:#10b981; }
.stat-lbl { font-size:0.45rem; color:#64748b; margin-top:2px; }

.pomo-bar { background:rgba(255,255,255,0.07); border-radius:2px; height:2px; margin-bottom:5px; overflow:hidden; }
.pomo-fill { height:100%; width:0%; background:linear-gradient(to right,#4facfe,#00f2fe); transition:width 1s linear; border-radius:2px; }

.status-row { display:flex; justify-content:space-between; align-items:center; font-size:0.5rem; color:#475569; gap:3px; flex-wrap:wrap; }
.badge { display:inline-flex; align-items:center; gap:2px; padding:2px 5px; border-radius:6px; background:rgba(255,255,255,0.05); white-space:nowrap; }
.badge.green { color:#10b981; }
.badge.red   { color:#f43f5e; background:rgba(244,63,94,0.08); }
.badge.weather { color:#93c5fd; }
.badge.meeting { color:#fbbf24; background:rgba(251,191,36,0.08); }

.close-btn {
  position: absolute; top: 4px; right: 6px;
  background: rgba(255,255,255,0.06); border: none;
  color: #64748b; cursor: pointer;
  width: 16px; height: 16px; border-radius: 50%;
  font-size: 0.55rem; display:flex; align-items:center; justify-content:center;
  -webkit-app-region: no-drag;
  transition: 0.2s;
}
.close-btn:hover { background:rgba(244,63,94,0.3); color:#f43f5e; }
</style>
</head>
<body>
<div class="pet-wrap" id="wrap">
  <button class="close-btn" onclick="closeWidget()" title="关闭">✕</button>
  <div id="bubble" class="bubble"></div>
  <div id="sprite" class="sprite"
       onclick="openMain()"
       oncontextmenu="event.preventDefault(); petInteract()"
       onmouseover="showPanel()"
       onmouseleave="hidePanel()">
  </div>
  <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>

  <div class="data-panel" id="data-panel"
       onmouseover="showPanel()" onmouseleave="hidePanel()">
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="w-streak">—</div>
        <div class="stat-lbl">🔥 连续打卡</div>
      </div>
      <div class="stat pomo idle" id="stat-pomo">
        <div class="stat-val" id="w-pomo">休息中</div>
        <div class="stat-lbl">⏱️ 专注倒计</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="w-drink">0</div>
        <div class="stat-lbl">💧 今日补给</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="w-rest">0</div>
        <div class="stat-lbl">🧘 今日调息</div>
      </div>
    </div>
    <div class="pomo-bar"><div class="pomo-fill" id="w-pomo-fill"></div></div>
    <div class="status-row">
      <span class="badge green" id="w-posture">✅ 坐姿正常</span>
      <span class="badge weather" id="w-weather">🌡️ —</span>
      <span class="badge" id="w-quiet" style="display:none;color:#6b7280">🌙 免打扰</span>
    </div>
    <div id="w-meeting-row" style="display:none;margin-top:3px">
      <span class="badge meeting" id="w-meeting">📅 —</span>
    </div>
  </div>
</div>

<script>
const { ipcRenderer } = require('electron');

function closeWidget() { ipcRenderer.send('widget-close'); }
function openMain()    { ipcRenderer.send('widget-open-main'); }

let _panelTimer = null;
function showPanel() {
  clearTimeout(_panelTimer);
  document.getElementById('data-panel').style.display = 'block';
  ipcRenderer.send('widget-resize', { width: 220, height: 280 });
}
function hidePanel() {
  _panelTimer = setTimeout(() => {
    document.getElementById('data-panel').style.display = 'none';
    ipcRenderer.send('widget-resize', { width: 140, height: 160 });
  }, 400);
}

let _animState = 'idle', _animFrame = 0;
const _rowMap = { idle:0, walk:1, play:2, sleep:3 };
setInterval(() => {
  _animFrame = (_animFrame + 1) % 4;
  const x = _animFrame * 33.333, y = _rowMap[_animState] * 33.333;
  const s = document.getElementById('sprite');
  if (s) s.style.backgroundPosition = `${x}% ${y}%`;
}, 200);

let _bubbleTimer = null;
function say(text) {
  const b = document.getElementById('bubble');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(_bubbleTimer);
  _bubbleTimer = setTimeout(() => b.classList.remove('show'), 3500);
}

let _playTimer = null;
let _isBad = false;
function petInteract() {
  _animState = 'play';
  try { new Audio('/pet/audio/meow.wav').play(); } catch(e) {}
  const replies = ['好舒服呀~ 💖','主人渴不渴？💧','今天要一起干大事！🚀','摸摸我，有灵性的~'];
  say(replies[Math.floor(Math.random() * replies.length)]);
  clearTimeout(_playTimer);
  _playTimer = setTimeout(() => { _animState = _isBad ? 'sleep' : 'idle'; }, 2000);
}

function updatePosture() {
  const bad = localStorage.getItem('hg_posture_bad') === '1';
  _isBad = bad;
  const sprite = document.getElementById('sprite');
  const panel  = document.getElementById('data-panel');
  const badge  = document.getElementById('w-posture');
  if (bad) {
    _animState = 'sleep';
    sprite.classList.add('bad');
    panel.classList.add('bad-posture');
    badge.textContent = '⚠️ 坐姿异常'; badge.className = 'badge red';
  } else {
    if (_animState === 'sleep') _animState = 'idle';
    sprite.classList.remove('bad');
    panel.classList.remove('bad-posture');
    badge.textContent = '✅ 坐姿正常'; badge.className = 'badge green';
  }
  const fill = document.getElementById('hp-fill');
  if (fill) fill.style.background = bad
    ? 'linear-gradient(to right,#b91c1c,#f43f5e)'
    : 'linear-gradient(to right,#f43f5e,#10b981)';
}

function updateCatSprite() {
  const cat = localStorage.getItem('hg_selected_cat') || 'cat_OrangeTabby';
  const s = document.getElementById('sprite');
  if (s) s.style.backgroundImage = `url('/pet/img/${cat}.png')`;
}

let secretKey = null;
async function refreshStats() {
  secretKey = secretKey || localStorage.getItem('health_guardian_key');
  if (!secretKey) return;
  try {
    const [stats, streak] = await Promise.all([
      fetch(`/api/stats?secretKey=${secretKey}`).then(r => r.json()),
      fetch(`/api/streak?secretKey=${secretKey}`).then(r => r.json()),
    ]);
    document.getElementById('w-streak').textContent = streak.streak ?? '—';
    const drink = (stats.today||[]).find(i=>i.remind_type==='DRINK')?.count||0;
    const rest  = (stats.today||[]).find(i=>i.remind_type==='SEDENTARY')?.count||0;
    document.getElementById('w-drink').textContent = drink;
    document.getElementById('w-rest').textContent  = rest;
    const hp = Math.min(100, 20 + (drink + rest) * 8);
    const fill = document.getElementById('hp-fill');
    if (fill) fill.style.width = hp + '%';
  } catch(e) {}
}

function tickPomo() {
  try {
    const raw = localStorage.getItem('hg_pomo_state');
    const el = document.getElementById('stat-pomo');
    const txt = document.getElementById('w-pomo');
    const fill = document.getElementById('w-pomo-fill');
    if (!raw) { txt.textContent='休息中'; el.className='stat pomo idle'; fill.style.width='0%'; return; }
    const s = JSON.parse(raw);
    if (!s.running||!s.endAt) { txt.textContent='休息中'; el.className='stat pomo idle'; fill.style.width='0%'; return; }
    const rem = Math.max(0, Math.ceil((s.endAt-Date.now())/1000));
    if (rem===0) { txt.textContent='完成!'; el.className='stat pomo idle'; fill.style.width='100%'; return; }
    txt.textContent = `${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`;
    el.className = 'stat pomo';
    fill.style.width = Math.max(0, rem/(s.duration||1500))*100+'%';
  } catch(e) {}
}

function updateWeather() {
  try {
    const raw = localStorage.getItem('hg_weather');
    const el = document.getElementById('w-weather');
    if (!raw) { el.textContent='🌡️ —'; return; }
    const w = JSON.parse(raw);
    el.textContent = `${w.icon} ${w.temp}°`;
  } catch(e) {}
}

function updateQuiet() {
  const qEnabled = localStorage.getItem('hg_quiet_enabled') !== 'false';
  const qStart   = localStorage.getItem('hg_quiet_start') || '21:00';
  const qEnd     = localStorage.getItem('hg_quiet_end')   || '07:00';
  const badge    = document.getElementById('w-quiet');
  const now = new Date(), cur = now.getHours()*60+now.getMinutes();
  const [sh,sm]=qStart.split(':').map(Number),[eh,em]=qEnd.split(':').map(Number);
  const s=sh*60+sm, e=eh*60+em;
  const inQ = s>e ? (cur>=s||cur<e) : (cur>=s&&cur<e);
  badge.style.display = (qEnabled && inQ) ? 'inline-flex' : 'none';
}

function updateMeeting() {
  const row=document.getElementById('w-meeting-row'), el=document.getElementById('w-meeting');
  if (!row||!el) return;
  try {
    const raw=localStorage.getItem('hg_meeting_end');
    if (!raw) { row.style.display='none'; return; }
    const diffMs=new Date(raw)-Date.now();
    if (diffMs<=0) { row.style.display='none'; return; }
    const mins=Math.ceil(diffMs/60000);
    const title=localStorage.getItem('hg_meeting_title')||'会议';
    el.textContent = mins<60 ? `📅 ${title}·${mins}分后` : `📅 ${title}·${Math.floor(mins/60)}h${mins%60}m`;
    row.style.display='block';
  } catch(e) { row.style.display='none'; }
}

refreshStats();
setInterval(refreshStats, 30000);
setInterval(() => {
  tickPomo(); updatePosture(); updateWeather(); updateQuiet(); updateMeeting(); updateCatSprite();
}, 1000);
</script>
</body>
</html>
