<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#0f172a"/>
  <!-- 上半身（扭转动画）-->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-18 50 58; 18 50 58; -18 50 58" dur="2.4s" repeatCount="indefinite"/>
    <!-- 头 -->
    <circle cx="50" cy="20" r="10" stroke="#00f2fe" stroke-width="2" fill="none"/>
    <!-- 颈 -->
    <line x1="50" y1="30" x2="50" y2="42" stroke="#4facfe" stroke-width="2"/>
    <!-- 上身 -->
    <line x1="50" y1="42" x2="50" y2="58" stroke="#4facfe" stroke-width="2.5"/>
    <!-- 手臂 平举 -->
    <line x1="50" y1="48" x2="18" y2="48" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="48" x2="82" y2="48" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
    <!-- 手 -->
    <circle cx="18" cy="48" r="3" fill="#00f2fe" opacity="0.8"/>
    <circle cx="82" cy="48" r="3" fill="#00f2fe" opacity="0.8"/>
  </g>
  <!-- 腰部以下不动（坐姿）-->
  <line x1="50" y1="58" x2="50" y2="72" stroke="#4facfe" stroke-width="2.5"/>
  <!-- 椅子/臀部水平线 -->
  <line x1="28" y1="72" x2="72" y2="72" stroke="#4facfe" stroke-width="2"/>
  <!-- 腿 (坐着弯曲) -->
  <line x1="35" y1="72" x2="30" y2="88" stroke="#4facfe" stroke-width="2"/>
  <line x1="65" y1="72" x2="70" y2="88" stroke="#4facfe" stroke-width="2"/>
  <line x1="30" y1="88" x2="18" y2="88" stroke="#4facfe" stroke-width="2"/>
  <line x1="70" y1="88" x2="82" y2="88" stroke="#4facfe" stroke-width="2"/>
  <text x="50" y="97" font-size="7" fill="#94a3b8" text-anchor="middle">脊柱扭转</text>
</svg>

