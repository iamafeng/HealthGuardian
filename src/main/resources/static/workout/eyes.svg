<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#0f172a"/>
  <!-- 头 (大，突出眼部) -->
  <circle cx="50" cy="32" r="22" stroke="#4facfe" stroke-width="1.5" fill="#1e293b"/>
  <!-- 左眼框 -->
  <ellipse cx="38" cy="32" rx="7" ry="5" stroke="#4facfe" stroke-width="1.5" fill="#0f172a"/>
  <!-- 左瞳孔 运动 -->
  <circle cx="38" cy="32" r="2.5" fill="#00f2fe">
    <animate attributeName="cx" values="38;44;38;32;38;38" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="32;32;36;32;32;32" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <!-- 右眼框 -->
  <ellipse cx="62" cy="32" rx="7" ry="5" stroke="#4facfe" stroke-width="1.5" fill="#0f172a"/>
  <!-- 右瞳孔 运动 -->
  <circle cx="62" cy="32" r="2.5" fill="#00f2fe">
    <animate attributeName="cx" values="62;68;62;56;62;62" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="32;32;36;32;32;32" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <!-- 眨眼遮盖 -->
  <ellipse cx="38" cy="32" rx="7.5" ry="0" fill="#1e293b" opacity="0">
    <animate attributeName="ry" values="0;5.5;0" begin="3s" dur="0.35s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" begin="3s" dur="0.35s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="62" cy="32" rx="7.5" ry="0" fill="#1e293b" opacity="0">
    <animate attributeName="ry" values="0;5.5;0" begin="3s" dur="0.35s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" begin="3s" dur="0.35s" repeatCount="indefinite"/>
  </ellipse>
  <!-- 颈 + 躯干（简略）-->
  <line x1="50" y1="54" x2="50" y2="72" stroke="#4facfe" stroke-width="2"/>
  <line x1="50" y1="60" x2="32" y2="68" stroke="#4facfe" stroke-width="2"/>
  <line x1="50" y1="60" x2="68" y2="68" stroke="#4facfe" stroke-width="2"/>
  <line x1="50" y1="72" x2="40" y2="86" stroke="#4facfe" stroke-width="2"/>
  <line x1="50" y1="72" x2="60" y2="86" stroke="#4facfe" stroke-width="2"/>
  <!-- 辐射线（远眺提示） -->
  <line x1="72" y1="28" x2="82" y2="24" stroke="#00f2fe" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="75" y1="32" x2="86" y2="32" stroke="#00f2fe" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
  </line>
  <line x1="72" y1="36" x2="82" y2="40" stroke="#00f2fe" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
  </line>
  <text x="50" y="97" font-size="7" fill="#94a3b8" text-anchor="middle">眼部放松</text>
</svg>

