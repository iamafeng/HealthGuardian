<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#0f172a"/>
  <!-- 头 -->
  <circle cx="50" cy="30" r="10" stroke="#00f2fe" stroke-width="2" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="-15 50 45; 15 50 45; -15 50 45" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- 身体 -->
  <line x1="50" y1="40" x2="50" y2="70" stroke="#4facfe" stroke-width="2"/>
  <!-- 手臂 -->
  <line x1="50" y1="50" x2="30" y2="60" stroke="#4facfe" stroke-width="2"/>
  <line x1="50" y1="50" x2="70" y2="60" stroke="#4facfe" stroke-width="2"/>
  <!-- 腿 -->
  <line x1="50" y1="70" x2="40" y2="90" stroke="#4facfe" stroke-width="2"/>
  <line x1="50" y1="70" x2="60" y2="90" stroke="#4facfe" stroke-width="2"/>
  <!-- 文字 -->
  <text x="50" y="95" font-size="8" fill="#fff" text-anchor="middle">左右转动颈部</text>
</svg>
