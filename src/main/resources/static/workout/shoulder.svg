<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#0f172a"/>
  <!-- 头 -->
  <circle cx="50" cy="22" r="10" stroke="#00f2fe" stroke-width="2" fill="none"/>
  <!-- 颈 -->
  <line x1="50" y1="32" x2="50" y2="42" stroke="#4facfe" stroke-width="2"/>
  <!-- 躯干 -->
  <line x1="50" y1="42" x2="50" y2="68" stroke="#4facfe" stroke-width="2"/>
  <!-- 左肩臂 - 前后环绕 -->
  <line x1="50" y1="46" x2="28" y2="52" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
      values="-20 50 46; 20 50 46; -20 50 46" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <!-- 右肩臂 - 反向环绕 -->
  <line x1="50" y1="46" x2="72" y2="52" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
      values="20 50 46; -20 50 46; 20 50 46" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <!-- 轨迹弧线提示 -->
  <ellipse cx="50" cy="46" rx="22" ry="10" stroke="#4facfe" stroke-width="0.6"
    fill="none" stroke-dasharray="3 3" opacity="0.35"/>
  <!-- 腿 -->
  <line x1="50" y1="68" x2="38" y2="88" stroke="#4facfe" stroke-width="2"/>
  <line x1="50" y1="68" x2="62" y2="88" stroke="#4facfe" stroke-width="2"/>
  <text x="50" y="97" font-size="7" fill="#94a3b8" text-anchor="middle">肩部环绕</text>
</svg>

