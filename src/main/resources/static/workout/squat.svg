<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#0f172a"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 10; 0 0" dur="1.5s" repeatCount="indefinite"/>
    <!-- 头 -->
    <circle cx="50" cy="30" r="10" stroke="#00f2fe" stroke-width="2" fill="none"/>
    <!-- 身体 -->
    <line x1="50" y1="40" x2="50" y2="70" stroke="#4facfe" stroke-width="2"/>
    <!-- 手臂 (平举) -->
    <line x1="50" y1="50" x2="20" y2="50" stroke="#4facfe" stroke-width="2"/>
    <line x1="50" y1="50" x2="80" y2="50" stroke="#4facfe" stroke-width="2"/>
    <!-- 腿 (弯曲效果模拟) -->
    <path d="M50 70 L40 85 L40 90" stroke="#4facfe" stroke-width="2" fill="none">
        <animate attributeName="d" values="M50 70 L40 85 L40 90; M50 70 L35 80 L40 90; M50 70 L40 85 L40 90" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M50 70 L60 85 L60 90" stroke="#4facfe" stroke-width="2" fill="none">
        <animate attributeName="d" values="M50 70 L60 85 L60 90; M50 70 L65 80 L60 90; M50 70 L60 85 L60 90" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="50" y="95" font-size="8" fill="#fff" text-anchor="middle">原地深蹲</text>
</svg>
