<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#0f172a"/>
  <!-- 头 -->
  <circle cx="50" cy="22" r="10" stroke="#00f2fe" stroke-width="2" fill="none"/>
  <!-- 躯干 -->
  <line x1="50" y1="32" x2="50" y2="65" stroke="#4facfe" stroke-width="2"/>
  <!-- 手臂 -->
  <line x1="50" y1="44" x2="28" y2="54" stroke="#4facfe" stroke-width="2"/>
  <line x1="50" y1="44" x2="72" y2="54" stroke="#4facfe" stroke-width="2"/>
  <!-- 左手腕旋转 -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 28 54; 360 28 54" dur="2.2s" repeatCount="indefinite"/>
    <circle cx="28" cy="54" r="5" stroke="#00f2fe" stroke-width="1.5" fill="none"/>
    <line x1="28" y1="54" x2="28" y2="49" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 右手腕旋转（反向） -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 72 54; -360 72 54" dur="2.2s" repeatCount="indefinite"/>
    <circle cx="72" cy="54" r="5" stroke="#00f2fe" stroke-width="1.5" fill="none"/>
    <line x1="72" y1="54" x2="72" y2="49" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 腿 -->
  <line x1="50" y1="65" x2="38" y2="85" stroke="#4facfe" stroke-width="2"/>
  <line x1="50" y1="65" x2="62" y2="85" stroke="#4facfe" stroke-width="2"/>
  <text x="50" y="97" font-size="7" fill="#94a3b8" text-anchor="middle">手腕舒展</text>
</svg>

